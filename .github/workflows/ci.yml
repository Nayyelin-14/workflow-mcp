name: CI

on:
  pull_request:
    branches: [qa, main]
  push:
    branches: [main, qa]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: Lint
            script: lint
          - name: TypeScript
            script: typecheck
          - name: Tests
            script: test:ci
          - name: Audit
            script: audit

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          restore-next-cache: "false"

      - name: Run ${{ matrix.task.name }}
        run: npm run ${{ matrix.task.script }}
        shell: bash

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [code-quality]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          DATABASE_URL: mongodb://dummy/dummy
          KINDE_CLIENT_ID: dummy
          KINDE_CLIENT_SECRET: dummy
          KINDE_ISSUER_URL: https://dummy.kinde.com
          KINDE_SITE_URL: http://localhost:3000
          KINDE_POST_LOGIN_REDIRECT_URL: http://localhost:3000/workflow
          KINDE_POST_LOGOUT_REDIRECT_URL: http://localhost:3000/

  deploy:
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=${{ github.ref_name == 'main' && 'production' || 'preview' }}

      - name: Build project artifacts
        run: npx vercel build

      - name: Deploy to Vercel
        id: vercel
        run: |
          URL=$(npx vercel deploy --prebuilt \
            ${{ github.ref_name == 'main' && '--prod' || '' }})

      - name: Smoke test
        id: smoke
        continue-on-error: true
        run: |
          URL="${{ steps.vercel.outputs.url }}"
          echo "Smoke testing: $URL"
          BODY=$(curl --silent --max-time 30 "$URL")
          if ! echo "$BODY" | grep -qi '<html'; then
            echo "✗ Response doesn't contain HTML"
            exit 1
          fi
          echo "✓ Deploy is live"

      - name: Rollback on failure
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke test failed — rolling back"
          npx vercel rollback --yes
          echo "✓ Rolled back"
          exit 1
