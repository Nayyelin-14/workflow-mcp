name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.check.outputs.environment }}
    steps:
      - name: Check branch
        id: check
        run: |
          BRANCH="${{ github.ref_name }}"

          if [[ "$BRANCH" == "main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == "qa" ]]; then
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          else
            echo "Branch $BRANCH is not deployable"
            exit 1
          fi

  deploy:
    name: Deploy to ${{ needs.gate.outputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate]
    environment:
      name: ${{ needs.gate.outputs.environment }}
      url: ${{ steps.vercel.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=${{ needs.gate.outputs.environment }}

      - name: Build project artifacts
        run: npx vercel build

      - name: Deploy to Vercel (preview)
        id: vercel
        run: |
          URL=$(npx vercel deploy --prebuilt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          URL="${{ steps.vercel.outputs.url }}"
          echo "Smoke testing: $URL"
          curl --fail --silent --max-time 30 "$URL" > /dev/null && echo "✓ Deploy is live"

      - name: Promote to production
        if: needs.gate.outputs.environment == 'production'
        run: |
          npx vercel promote "${{ steps.vercel.outputs.url }}" --token=${{ secrets.VERCEL_TOKEN }}
          echo "✓ Promoted to production"
