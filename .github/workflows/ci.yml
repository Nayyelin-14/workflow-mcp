name: CI

on:
  pull_request:
    branches: [qa, main]
  push:
    branches: [main, qa]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: Lint
            script: lint
          - name: TypeScript
            script: typecheck
          - name: Tests
            script: ${{ github.event_name == 'pull_request' && 'test:coverage' || 'test:ci' }}
            upload-coverage: true

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run ${{ matrix.task.name }}
        run: npm run ${{ matrix.task.script }}
        shell: bash

      - name: Upload coverage report
        if: matrix.task.upload-coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Post coverage summary
        if: matrix.task.upload-coverage && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            if (!fs.existsSync("coverage/coverage-summary.json")) {
              console.log("Coverage summary not found — skipping comment");
              return;
            }

            const summary = JSON.parse(
              fs.readFileSync("coverage/coverage-summary.json", "utf8"),
            );

            const total = summary.total;
            const lines = total.lines.pct;
            const statements = total.statements.pct;
            const branches = total.branches.pct;
            const functions = total.functions.pct;

            const body = [
              "## Coverage Report",
              "",
              "| Metric | % |",
              "|--------|---|",
              `| Lines | ${lines} |`,
              `| Statements | ${statements} |`,
              `| Branches | ${branches} |`,
              `| Functions | ${functions} |`,
              "",
              `> Generated by vitest — ${new Date().toISOString().split("T")[0]}`,
            ].join("\n");

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [code-quality]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          DATABASE_URL: mongodb://dummy/dummy
          KINDE_CLIENT_ID: dummy
          KINDE_CLIENT_SECRET: dummy
          KINDE_ISSUER_URL: https://dummy.kinde.com
          KINDE_SITE_URL: http://localhost:3000
          KINDE_POST_LOGIN_REDIRECT_URL: http://localhost:3000/workflow
          KINDE_POST_LOGOUT_REDIRECT_URL: http://localhost:3000/

  ci-passed:
    if: always()
    needs: [code-quality, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check build result
        run: |
          result="${{ needs.build.result }}"
          if [[ "$result" != "success" ]]; then
            echo "CI failed (result: $result)"
            exit 1
          fi
          echo "CI passed"
