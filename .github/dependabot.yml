version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: qa
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      react:
        patterns:
          - "react*"
          - "@types/react*"
      nextjs:
        patterns:
          - "next*"
          - "eslint-config-next"
      testing:
        patterns:
          - "vitest*"
          - "@testing-library/*"
          - "jsdom"
      ui:
        patterns:
          - "radix-ui"
          - "lucide-react"
          - "class-variance-authority"
          - "tailwind-*"
          - "postcss"
          - "clsx"

  - package-ecosystem: github-actions
    directory: /
    target-branch: qa
    schedule:
      interval: monthly
    labels:
      - ci
