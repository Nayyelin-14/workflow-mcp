name: CI

on:
  # CI runs only on PRs. Direct pushes to qa/main are blocked by branch
  # protection, and merges are already gated by the required PR check, so the
  # duplicate post-merge push run is intentionally omitted.
  pull_request:
    branches: [qa, main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: Lint
            script: lint
          - name: TypeScript
            script: typecheck
          - name: Tests
            script: test:ci
          - name: Audit
            script: audit:ci

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          restore-next-cache: "false"

      - name: Run ${{ matrix.task.name }}
        run: npm run ${{ matrix.task.script }}
        shell: bash

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [code-quality]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          DATABASE_URL: mongodb://dummy/dummy
          KINDE_CLIENT_ID: dummy
          KINDE_CLIENT_SECRET: dummy
          KINDE_ISSUER_URL: https://dummy.kinde.com
          KINDE_SITE_URL: http://localhost:3000
          KINDE_POST_LOGIN_REDIRECT_URL: http://localhost:3000/workflow
          KINDE_POST_LOGOUT_REDIRECT_URL: http://localhost:3000/
          OPENROUTER_API_KEY: dummy

  ci-passed:
    needs: [code-quality, build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI passed"
