name: Deploy

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  gate:
    name: Gate check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.check.outputs.environment }}
    steps:
      - name: Check branch
        id: check
        run: |
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "main" ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == "qa" ]]; then
            echo "environment=preview" >> "$GITHUB_OUTPUT"
          else
            echo "Branch $BRANCH is not deployable"
            exit 1
          fi

      - name: Check CI status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION=$(gh run list \
            --workflow=CI \
            --commit=${{ github.sha }} \
            --json conclusion \
            --jq '.[0].conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "CI status is '$CONCLUSION' — deploy blocked"
            exit 1
          fi
          echo "CI passed for this commit"

  deploy:
    name: Deploy to ${{ needs.gate.outputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate]
    environment:
      name: ${{ needs.gate.outputs.environment }}
      url: ${{ steps.vercel.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=${{ needs.gate.outputs.environment }}

      - name: Build project artifacts
        run: npx vercel build

      - name: Deploy to Vercel
        id: vercel
        run: |
          URL=$(npx vercel deploy --prebuilt \
            ${{ needs.gate.outputs.environment == 'production' && '--prod' || '' }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          URL="${{ steps.vercel.outputs.url }}"
          echo "Smoke testing: $URL"
          curl --fail --silent --max-time 30 "$URL" > /dev/null && echo "✓ Deploy is live"
